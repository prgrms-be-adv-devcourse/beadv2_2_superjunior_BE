#file: noinspection SpellCheckingInspection
name: Batch Jobs Build

on:
  push:
    branches:
      - dev
      - feature/ci-cd
    paths:
      - 'batch/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - './.github/workflows/batch-jobs-build.yml'

env:
  DOCKER_IMAGE: minbros/batch

jobs:
  build-batch-image:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[skip deploy]')"

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: JDK 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle 실행 권한 부여
      shell: bash
      run: chmod +x ./gradlew

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 버전 태그 생성
      id: version
      shell: bash
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "Image tag: $SHORT_SHA"

    - name: Jib로 Docker 이미지 빌드 및 Push
      run: |
        ./gradlew :batch:jib \
          -Djib.from.platforms=linux/amd64,linux/arm64 \
          -Djib.to.image=${{ env.DOCKER_IMAGE }} \
          -Djib.to.tags=${{ steps.version.outputs.tag }} \
          -Djib.to.auth.username=${{ secrets.DOCKER_USERNAME }} \
          -Djib.to.auth.password=${{ secrets.DOCKER_PASSWORD }}
