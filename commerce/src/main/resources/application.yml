#file: noinspection SpellCheckingInspection, HttpUrlsUsage
spring:
  application:
    name: commerce

  flyway:
    enabled: true
    default-schema: product_schema
    schemas:
      - product_schema
      - order_schema
      - settlement_schema
    create-schemas: true

  datasource:
    url: ${PRODUCT_DATABASE_P6SPY_URL}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    username: ${PRODUCT_DATABASE_USERNAME}
    password: ${PRODUCT_DATABASE_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO product_schema, order_schema, public
      maximum-pool-size: 80
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  otlp:
    metrics:
      export:
        enabled: false

client:
  member: http://member-service:8083
  point: http://point-service:8086

kafka:
  bootstrap-servers: ${spring.kafka.bootstrap-servers}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
      region: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka: warn


outbox:
  publisher:
    fixed-delay-ms: 1000
    batch-size: 100
    send-timeout-ms: 5000
    processing-timeout-ms: 600000
    retry-base-delay-ms: 2000
    retry-max-delay-ms: 60000
    max-retries: 10

