spring:
  application:
    name: commerce-test

  flyway:
    enabled: true
    default-schema: product_schema
    schemas:
      - product_schema
      - order_schema
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product_schema
        hbm2ddl:
          create_namespaces: true
        format_sql: true
        show_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

gateway:
  host: http://localhost:8000

token:
  internal:
    secret: test-secret-key

client:
  member: http://member-service:8083

kafka:
  bootstrap-servers: localhost:9092
