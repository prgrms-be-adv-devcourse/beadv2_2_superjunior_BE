dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    //common 모듈
    implementation project(':common')

    implementation(project(path: ':member', configuration: 'domainElements'))
    implementation(project(path: ':commerce', configuration: 'domainElements'))
//    implementation(project(path: ':recommendation', configuration: 'domainElements'))
    implementation(project(path: ':point', configuration: 'domainElements'))
    
    // BCrypt 비밀번호 인코딩 (실제 인증 로직과 동일한 해시 생성)
    implementation 'org.springframework.security:spring-security-crypto'

    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'

    testImplementation 'org.springframework.security:spring-security-test'

    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'

    jib {
        from {
            image = 'eclipse-temurin:17-jre'
        }
    }
}

bootJar {
    enabled = true
}

tasks.register('generateProductVectorDummy', JavaExec) {
    group = 'dummy-data'
    description = 'Generate product_vector dummy CSV via DummyDataApplication.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'store_0982.dummy_data.DummyDataApplication'
}
