spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  elasticsearch:
    uris: http://localhost:9200
  cloud:
    openfeign:
      lazy-attributes-resolution: true

client:
  member: http://localhost:8083
  commerce: http://localhost:8087
  ai: http://localhost:8088

logging:
  level:
    org.springframework.batch: DEBUG
    store._0982.batch: DEBUG
