#file: noinspection SpellCheckingInspection
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/logs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10

    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Annotations Off
        Labels On

    [FILTER]
        Name nest
        Match kube.*
        Operation lift
        Nested_under kubernetes
        Add_prefix k8s_

    [FILTER]
        Name grep
        Match kube.*
        Regex k8s_pod_name ^(gateway-|member-|commerce-|point-|ai-|kafka-|search-|redis-)

    [FILTER]
        Name modify
        Match kube.*
        Add cluster_name 0909-k8s-cluster
        Add environment production

    [FILTER]
        Name grep
        Match kube.*
        Exclude log ^\s*$

    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-service.default.svc.cluster.local
        Port 9200
        Logstash_Format On
        Logstash_Prefix logs
        Logstash_DateFormat %Y.%m.%d
        Type _doc
        Retry_Limit 3
        Suppress_Type_Name On
        Buffer_Size 5MB
        tls Off

    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines

  parsers.conf: |
    [PARSER]
        Name docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name syslog
        Format regex
        Regex ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key time
        Time_Format %b %d %H:%M:%S

  custom_parsers.conf: |
    [PARSER]
        Name spring-boot
        Format regex
        Regex ^(?<time>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>\w+)\s+\[(?<service>[\w-]+),(?<trace_id>[\w-]*),(?<span_id>[\w-]*)\]\s+(?<pid>\d+)\s+---\s+\[\s*(?<thread>[\w-]+)\]\s+(?<logger>[\w\.]+)\s+:\s+(?<message>.*)$
        Time_Key time
        Time_Format %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name json-log
        Format json
        Time_Key timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app: fluent-bit
    version: v3.2.2
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
        version: v3.2.2
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 10
      # hostNetwork를 사용하여 노드 레벨 로그 수집
      hostNetwork: false
      dnsPolicy: ClusterFirst

      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.2.2
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 2020
          protocol: TCP

        # 환경변수
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: "elasticsearch-service.default.svc.cluster.local"
        - name: FLUENT_ELASTICSEARCH_PORT
          value: "9200"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # 리소스 제한
        resources:
          limits:
            ephemeral-storage: 512Mi
            cpu: 200m
            memory: 256Mi
          requests:
            ephemeral-storage: 256Mi
            cpu: 100m
            memory: 128Mi

        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 2020
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 2020
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5

        # Volume mounts
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
        - name: systemd
          mountPath: /run/log/journal
          readOnly: true

      # Volumes
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
      - name: systemd
        hostPath:
          path: /run/log/journal

      # Node selector (선택적)
      # nodeSelector:
      #   node-role: logging

      # Tolerations: 모든 노드에서 실행되도록 설정
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
---
# Service: Fluent Bit 메트릭 및 상태 확인용
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: monitoring
  labels:
    app: fluent-bit
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 2020
    targetPort: 2020
    protocol: TCP
  selector:
    app: fluent-bit
