#file: noinspection SpellCheckingInspection
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    # 영속성 비활성화 (캐싱 용)
    save ""
    appendonly no
    
    maxmemory 384mb
    maxmemory-policy allkeys-lru
    
    stop-writes-on-bgsave-error yes

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: "redis-service"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: monitoring-server
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - /etc/redis/redis.conf
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
          resources:
            requests:
              ephemeral-storage: "512Mi"
              memory: "384Mi"
              cpu: "100m"
            limits:
              ephemeral-storage: "1Gi"
              memory: "512Mi"
              cpu: "500m"
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "redis-cli shutdown save"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli ping | grep PONG"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli ping | grep PONG"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
