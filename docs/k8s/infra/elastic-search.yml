#file: noinspection SpellCheckingInspection
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  serviceName: "elasticsearch-service"
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
        fluentbit.io/exclude: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: infra-server
      terminationGracePeriodSeconds: 120
      containers:
        - name: elasticsearch
          image: minbros/elasticsearch-nori:8.18.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
            - name: cluster.name
              value: "group-purchase-cluster"
            - name: node.name
              value: "group-purchase-node"
          resources:
            requests:
              ephemeral-storage: "2Gi"
              memory: "1.5Gi"
              cpu: "500m"
            limits:
              ephemeral-storage: "3Gi"
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: elasticsearch-storage
              mountPath: /usr/share/elasticsearch/data
            - name: plugins
              mountPath: /usr/share/elasticsearch/plugins
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 15"
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: elasticsearch-exporter
          image: prometheuscommunity/elasticsearch-exporter:v1.7.0
          args:
            - --es.uri=http://localhost:9200
            - --es.all
          ports:
            - containerPort: 9114
              name: metrics
          resources:
            limits:
              ephemeral-storage: 256Mi
              cpu: 200m
              memory: 128Mi
            requests:
              ephemeral-storage: 128Mi
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
      name: http
    - port: 9300
      targetPort: 9300
      protocol: TCP
      name: transport
  selector:
    app: elasticsearch
